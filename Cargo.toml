[workspace]
resolver = "2"
members = [
  "crates/lbry-blob",
  "crates/lbry-blob-iroh",
  "bins/browser-superpeer",
]
default-members = ["bins/browser-superpeer"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/realrouse/lbry-rs"

[workspace.dependencies]
anyhow = "1"
aes = "0.8"
axum = { version = "0.8", features = ["macros", "multipart"] }
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc"] }
cipher = { version = "0.4", features = ["block-padding", "alloc"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
iroh = "1"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lbry-blob = { path = "crates/lbry-blob" }
lbry-blob-iroh = { path = "crates/lbry-blob-iroh" }
